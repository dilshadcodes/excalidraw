name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.x
      - name: Install
        run: yarn install
      - name: Build
        # Set the `SITE_URL` repository variable
        # (Settings → Secrets and variables → Actions → Variables) to change
        # the canonical site URL; the Vite config derives the base path from
        # it and falls back to the default in excalidraw-app/vite.config.mts.
        env:
          VITE_APP_SITE_URL: ${{ vars.SITE_URL }}
        run: yarn build
      - name: Add SPA fallback for GitHub Pages 404s
        run: cp excalidraw-app/build/index.html excalidraw-app/build/404.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: excalidraw-app/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
